<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Skills - SkillSwap Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/pages/index.html">SkillSwap Hub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/pages/browse-skills.html">Browse Skills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/offer-skill.html">Offer a Skill</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/dashboard.html">My Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/about.html">About Developers</a>
                    </li>
                    <li class="nav-item auth-links">
                        <a class="nav-link" href="/pages/login.html">Login</a>
                    </li>
                    <li class="nav-item auth-links">
                        <a class="nav-link" href="/pages/register.html">Register</a>
                    </li>
                    <li class="nav-item user-links d-none">
                        <span class="nav-link username-link"></span>
                    </li>
                    <li class="nav-item user-links d-none">
                        <a class="nav-link" href="#" id="logout-btn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">
        <h1 class="mb-4">Browse Skills</h1>
        
        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" id="search-input" class="form-control" placeholder="Search skills...">
            </div>
            <div class="col-md-4">
                <select id="category-filter" class="form-select">
                    <option value="">All Categories</option>
                    <option value="programming">Programming</option>
                    <option value="design">Design</option>
                    <option value="languages">Languages</option>
                    <option value="music">Music</option>
                    <option value="academic">Academic</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="col-md-2">
                <button id="search-btn" class="btn btn-primary w-100">Search</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Skills Grid -->
        <div id="skills-grid" class="row g-4 d-none">
            <!-- Skills will be dynamically loaded here -->
        </div>

        <!-- No Results Message -->
        <div id="no-results" class="text-center py-5 d-none">
            <h3>No skills found</h3>
            <p>Try adjusting your search or filter criteria.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2026 SkillSwap Hub. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/skills.js"></script>
</body>
</html>
